# 术语与口径库 v0.1（模板）
# 用途：大白话 → 本表查术语；查不到 → 升级包问人，不编
# 维护人：每单复盘后追加
# 规则：
#   1. 本文件只放术语与口径事实，不放凭据明文（凭据只写文件路径）
#   2. 多环境并存时，必须在"环境"节写明并存警示（杀 FM-B10：命令打错目标）
#   3. 〈占位符〉落地时全文替换为实际值；替换后本注释节可删
# 来源：〈流程文档/链路验证记录等真实材料名〉

环境:
  集群: "〈集群A〉（〈节点1-3〉三节点，〈OS 版本〉，〈用户名〉）"
  计算组件: "〈Hadoop 版本〉 / 〈Hive 版本〉 / 〈资源调度版本〉"
  采集组件: "〈批量导出工具版本〉 / 〈消息队列版本〉 / 〈日志采集器版本〉"
  实时组件: "〈流计算引擎版本〉（链路2）"
  数据库: "〈数据库类型与版本〉"
  业务库: "〈业务库名〉（N 张表；以最近一次实测为准，旧记录作废须留痕）"
  实时工程: "〈实时工程目录〉（链路2）"
  多集群警示: "〈集群A〉与〈集群B〉（〈IP 段占位〉）并存，命令勿混目标（FM-B10，IP 相邻易混）"
  未启动组件: "〈已装已配置、按需手动启动的组件清单〉"

采集链路术语:
  全量同步: "〈全量同步脚本〉，N 张表，每日快照，资源调度多 mapper"
  增量同步: "〈增量同步脚本〉，N 张表，append / lastmodified"
  首日全量初始化: "--init 参数，存量入首日分区并写断点"
  断点控制表: "〈业务库〉.〈断点控制表〉（断点值/状态/行数）——注意保留字风险（如 last_value 类列名）"
  元数据治理表: "〈业务库〉.〈元数据表〉（同步类型/检查列/分片列/并发）"
  幂等: "临时目录 + 原子 mv；同分区重跑行数不变"
  密码文件: "〈密码文件路径〉（字节数与换行状态须断言，同步一份到分布式存储；明文不进本表——只存路径）"
  对账: "〈对账脚本〉：源库 vs 落盘行数比对；0 行 append 表属正常不是异常"
  日志链路: "〈日志采集器〉 → 〈消息队列 topic〉 → 〈时间戳拦截器〉 → 分布式存储按业务日期分区"
  业务日期分区: "时区口径取日志体内 ts（13 位毫秒），不用本地时间"
  ODS: "〈ODS库〉.〈表〉_full / 〈ODS库〉.〈表〉_inc / 〈ODS库〉.〈日志表〉，外部表 + dt 分区"
  调度: "〈调度方式〉每日 〈时刻〉 → 〈日调度脚本〉（全量→增量→对账→ODS）"

实时链路术语（链路2用）:
  作业清单: "〈DWD/DWS 作业数与清单，须枚举不靠记忆〉"
  DWS 表: "〈窗口聚合表清单，按分区字段〉"
  大屏: "〈大屏服务端口与接口清单；归属哪个环境须写明，归属不明走升级包〉"
  验证脚本: "〈机械Gate脚本路径〉"
  StreamLoad label: "≤128 字符；长表名需缩短 labelPrefix（如引擎为 OLAP 库时适用）"
  ts 口径: "窗口按处理时间还是事件时间，须写死一种并写明禁用项"

大白话映射（示例行，按域追加）:
  "把这张表也采一下": 新增一张表的采集同步（全量或增量，查元数据表定类型）
  "对一下数": 行数对账（源库 vs 落盘 vs ODS 三方）
  "重跑一次别出岔子": 幂等验证（同分区二次执行 count 不变）
  "补历史数据": 数据回刷（--init，注意断点与并发）
  "出个图/上大屏": 实时链路 2 的新增指标需求
  "跑不通了": 先看 state.json 停在哪个 gate，不是重头再来
  "洗盘": 〈重装/重建后全新安装核验的域内说法〉
  "如图指标/这张图": 随截图指称指标——先按截图锚定具体表名+接口（材料直读），不得按图面标题自造口径
